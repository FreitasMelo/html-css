<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }
        th,td {
            border: 1px solid black;
            padding: 10px;
        }
        tr.destaque {
            background-color: rgba(104, 102, 102, 0.589);
        }
        col.cnome{
            background-color: rgba(88, 87, 87, 0.603);
        }
    </style>
</head>
<body>
    <h1> Exercicios de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption> Cadastro</caption>
        <tr> 
            <th scope="col"> Nome</th>
            <th scope="col"> Sexo</th>
            <th scope="col"> Idade</th>
            <th scope="col"> Profissão</th>
        </tr>
        <tr>
            <td> Ana Maria</td>
            <td> F</td>
            <td> 27 </td>
            <td> Jornalista</td>
        </tr>
        <tr>
            <td> João Carlos</td>
            <td> M</td>
            <td> 19</td>
            <td>Programador</td>
        </tr>
        <tr> 
            <td>Roberto</td>
            <td>M</td>
            <td>30</td>
            <td>Eletricista</td>
        </tr>
        <tr>
            <td>Joana</td>
            <td>F</td>
            <td>22</td>
            <td>Recepcionista</td>
        </tr>
        <tr>
            <td>Sophia</td>
            <td>F</td>
            <td>32</td>
            <td>Cabeleleira</td>
        </tr>
    </table>
</body>
</html>
